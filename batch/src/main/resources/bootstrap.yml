spring:
  application:
    name: batch
  profiles:
    active: dev

  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: properties
        namespace: train
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: train

    sentinel:
      transport:
        port: 8719
        dashboard: localhost:18080
      datasource:
        degrade:
          nacos:
            serverAddr: 127.0.0.1:8848
            namespace: train
            groupId: DEFAULT_GROUP
            dataId: sentinel-batch-degrade
            ruleType: degrade

    openfeign:
      lazy-attributes-resolution: true

feign:
  sentinel:
    enabled: true
