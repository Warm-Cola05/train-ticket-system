server:
  port: 8000
spring:
  cloud:
    gateway:
      routes:
        - id: member
          predicates:
            - Path=/member/**
#          uri: http://127.0.0.1:8001
          uri: lb://member
        - id: business
          predicates:
            - Path=/business/**
          uri: lb://business
        - id: batch
          predicates:
            - Path=/batch/**
          uri: lb://batch
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedHeaders: '*'
            allowedMethods: '*'
            allowCredentials: true
            maxAge: 3600
