server:
  port: 8002
  servlet:
    context-path: /business

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/train_business?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: root
  application:
    name: business
  data:
    redis:
      host: 192.168.47.130
      port: 6379
      password: 123456
  cache:
    type: redis
    redis:
      use-key-prefix: true
      key-prefix: train_cache_
      cache-null-values: true
      time-to-live: 60s
  # RocketMQ 配置：name-server 为 NameServer 地址，producer.group 生产者分组
  rocketmq:
    name-server: 127.0.0.1:9876
    producer:
      group: default
  #sentinel控台: https://github.com/alibabo/spring-cloud-alibaba/wiki/Sentinel
  cloud:
    sentinel:
      transport:
        port: 8719
        dashboard: 127.0.0.1:8080
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    local-cache-scope: statement
logging:
  level:
    com:
      railway:
        train:
          business:
            mapper: trace