spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      # 配置中心
      config:
        file-extension: yml
        namespace: train
      # 注册中心
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: train
    sentinel:
      transport:
        dashboard: localhost:18080
      # sentinel + nacos 持久化
      datasource:
        nacos:
          nacos:
            serverAddr: localhost:8848
            namespace: train
            groupId: TRAIN_GROUP
            dataId: sentinel
            ruleType: flow

  profiles:
    active: dev
  application:
    name: business

# seata配置
seata:
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: train
      username: nacos
      password: nacos
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace: train
      dataId: seataServer.properties
      username: nacos
      password: nacos
