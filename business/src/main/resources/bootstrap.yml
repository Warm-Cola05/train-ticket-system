##nacos server地址
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      # 配置中心文件后缀，默认yml
      config:
        file-extension: yml
        ##nacos命名空间
        namespace: train
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: train
  profiles:
    active: dev
  #注册中心的名字，对应nacos控制台中的命名空间
  application:
    name: business
seata:
  #事务组名字
  tx-service-group: train-group
  #十事务组和seata集群做关联
  service:
    vgroup-mapping:
      train-group: default
    grouplist:
      #seata集群对应的机器
      default: 127.0.0.1:8091
